[project]
name = "account-access"
version = "0.6.0"
description = "Scoped, resumable account access through a portable skill, CLI, and private service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "authlib>=1.8,<2",
  "httpx2>=2.13,<3",
  "cryptography>=50,<51",
  "keyring>=25,<27",
  "pydantic>=2.11,<3",
  "playwright>=1.55,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "filelock>=3.18,<4",
  "pyotp>=2.9,<3",
]

[project.scripts]
account-access = "account_access.cli:main"
access = "account_access.cli:main"

[project.urls]
Repository = "https://github.com/fainir/account-access"
Documentation = "https://github.com/fainir/account-access#readme"
Issues = "https://github.com/fainir/account-access/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "pip-audit>=2.9,<3", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
