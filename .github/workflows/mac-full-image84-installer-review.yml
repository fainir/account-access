name: Full image 84 configuration-upgrade Installer acceptance
on:
  # The new workflow need not be merged into default just to qualify a candidate.
  # A reviewed new asset contract schedules acceptance on this exact branch.
  # Source-only fixes must not rerun an already-refused candidate package.
  push:
    branches: [codex/full-image-update]
    paths: [artifacts/full-image-installer84-inputs.json, .github/workflows/mac-full-image84-installer-review.yml]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  download-reviewed-inputs:
    if: github.repository == 'fainir/account-access'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Draft release assets need push-capable visibility; this job makes GETs
    # only. No token or authenticated CLI state is transferred to the Mac.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download only committed fixed repository/asset/hash identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B scripts/download_full_image_installer_inputs.py \
            --contract artifacts/full-image-installer84-inputs.json --cohort 84 \
            --output "$RUNNER_TEMP/account-access-full-image-input"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-image84-configuration-upgrade-reviewed-inputs
          path: ${{ runner.temp }}/account-access-full-image-input
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  actual-installer:
    needs: download-reviewed-inputs
    if: github.repository == 'fainir/account-access'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [install-reapply, interrupt-remove, interrupt-create]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: full-image84-configuration-upgrade-reviewed-inputs
          path: ${{ runner.temp }}/account-access-full-image-input
      - name: Verify disposable ARM64 host and invoke only the guarded root probe
        env:
          AC_SCENARIO: ${{ matrix.scenario }}
        run: |
          test "$(uname -m)" = arm64
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = fainir/account-access
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHON=$(command -v python3)
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=C LC_ALL=C \
            GITHUB_ACTIONS=true CI=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=macOS RUNNER_ARCH=ARM64 \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            "$PYTHON" -I -B "$GITHUB_WORKSPACE/scripts/mac_full_image_installer_probe.py" \
              --repository "$GITHUB_WORKSPACE" --bundle "$RUNNER_TEMP/account-access-full-image-input" \
              --scenario "$AC_SCENARIO" --cohort 84
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-image84-configuration-upgrade-installer-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /Library/Logs/AccountAccessComponentInstallerQA-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
