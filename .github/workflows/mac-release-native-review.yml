name: Mac release native qualification
on:
  push:
    branches: [codex/production-security-authlib-20261028]
    paths: [artifacts/release120-native-inputs.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-inputs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/native-inputs"
          gh release download qa-direct-root-recovery119-20261030 --repo fainir/account-access --pattern release120-native-inputs.tar.gz --dir "$RUNNER_TEMP/native-inputs"
          python3 - "$RUNNER_TEMP/native-inputs" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          pin = json.loads(pathlib.Path('artifacts/release120-native-inputs.json').read_bytes())
          assert hashlib.sha256((root / 'release120-native-inputs.tar.gz').read_bytes()).hexdigest() == pin['sha256']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-native-public-inputs
          path: ${{ runner.temp }}/native-inputs
          retention-days: 3
  qualify-and-compile:
    needs: public-inputs
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --locked
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-native-public-inputs
          path: ${{ runner.temp }}/native-inputs
      - name: Extract only the five reviewed public plan files
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root / 'native-inputs/release120-native-inputs.tar.gz') as archive:
              expected = {'plan.json', 'before.json', 'after.json', 'old-identity.json', 'new-identity.json'}
              members = archive.getmembers()
              assert len(members) == 5 and {m.name for m in members} == expected
              assert all(m.isfile() and 0 < m.size <= 34 * 1024 * 1024 for m in members)
              archive.extractall(root / 'direct-inputs', filter='data')
          PY
      - name: Verify shared installed adapter and refusal boundaries
        run: uv run python scripts/mac_full_image_installed_probe.py --output "$RUNNER_TEMP/native-full"
      - name: Verify runtime source, recovery and ordinary-user refusal
        run: uv run python scripts/mac_runtime_upgrade_probe.py --output "$RUNNER_TEMP/native-runtime"
      - name: Verify exact 110-to-120 plan, projections and published runtime groups
        run: uv run python scripts/mac_direct_runtime_upgrade_probe.py --inputs "$RUNNER_TEMP/direct-inputs" --output "$RUNNER_TEMP/native-direct"
      - name: Compile the fixed updater without publisher credentials
        run: |
          uv run python - <<'PY'
          import json, os, pathlib, runpy, subprocess
          from scripts import build_direct_runtime_upgrade_candidate as build
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          shared = runpy.run_path('scripts/mac_full_image_installed_probe.py')
          plan = json.loads((root / 'direct-inputs/plan.json').read_bytes())
          assert build.digest((root / 'direct-inputs/plan.json').read_bytes()) == build.PLAN_SHA256
          output = root / 'release-compiled'
          output.mkdir()
          sources = build.prepare_updater_sources(build.source_inputs(shared), shared, plan, output / 'source')
          binary = output / 'AccountAccess-runtimeupgrade'
          subprocess.run(['/usr/bin/xcrun', 'swiftc', '-j', '2', '-O', '-whole-module-optimization',
              '-parse-as-library', '-warnings-as-errors', '-D', 'ACCOUNT_ACCESS_RUNTIME_UPGRADE_MAIN',
              '-target', 'arm64-apple-macos14', '-framework', 'Foundation', '-framework', 'CryptoKit',
              '-framework', 'Security', *sources, '-o', str(binary)], check=True, timeout=1800)
          result = subprocess.run([str(binary)], capture_output=True, timeout=30)
          assert result.returncode == 78 and not result.stderr
          assert json.loads(result.stdout)['reason'] == 'runtime_upgrade_installer_context_required'
          PY
      - run: |
          mkdir "$RUNNER_TEMP/native-results"
          cp "$RUNNER_TEMP/native-full/result.json" "$RUNNER_TEMP/native-results/full-image.json"
          cp "$RUNNER_TEMP/native-runtime/result.json" "$RUNNER_TEMP/native-results/runtime.json"
          cp "$RUNNER_TEMP/native-direct/result.json" "$RUNNER_TEMP/native-results/direct.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-native-results
          path: ${{ runner.temp }}/native-results
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-compiled-updater
          path: ${{ runner.temp }}/release-compiled/AccountAccess-runtimeupgrade
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: native-failure-diagnostics
          path: |
            ${{ runner.temp }}/native-full/*.log
            ${{ runner.temp }}/native-runtime/*.stderr
            ${{ runner.temp }}/native-direct/*.stderr
          retention-days: 7
