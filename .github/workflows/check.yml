name: Account Access checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-owner-ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check native owner screen and masked sync fields
        run: |
          xcrun swiftc -O -parse-as-library -D ACCOUNT_ACCESS_UI_CHECKS \
            -framework AppKit -framework CryptoKit -lsqlite3 \
            macos/AccountAccess.swift macos/MessageText.swift macos/MessagesReader.swift macos/Tests/OwnerScreenChecks.swift \
            -o /tmp/account-access-owner-checks
          /tmp/account-access-owner-checks
      - name: Check the narrow native Messages reader
        run: |
          xcrun swiftc -O -parse-as-library \
            -framework AppKit -framework CryptoKit -lsqlite3 \
            macos/MessageText.swift macos/MessagesReader.swift macos/Tests/MessagesReaderChecks.swift \
            -o /tmp/account-access-messages-checks
          /tmp/account-access-messages-checks
      - name: Check optimized app startup and reopening
        run: |
          xcrun swiftc -O -parse-as-library -D ACCOUNT_ACCESS_LAUNCH_CHECKS \
            -framework AppKit -framework CryptoKit -lsqlite3 \
            macos/AccountAccess.swift macos/MessageText.swift macos/MessagesReader.swift \
            -o /tmp/account-access-launch-checks
          AC_QA_ROOT=$(mktemp -d)
          ACCOUNT_ACCESS_DATA_DIR="$AC_QA_ROOT/data" ACCOUNT_ACCESS_INSTALL_DIR="$AC_QA_ROOT/runtime" \
            /tmp/account-access-launch-checks
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Check that the installer uses the tested dependency hashes
        run: |
          uv export --locked --no-dev --no-emit-project --no-annotate --no-header --format requirements.txt --output-file /tmp/account-access-runtime.txt > /dev/null
          cmp account_access/runtime-requirements.txt /tmp/account-access-runtime.txt
      - run: uv run playwright install --with-deps chromium
      - name: Allow sandbox namespaces for the installed browser binaries
        run: |
          uv run python - <<'PY'
          from playwright.sync_api import Error, sync_playwright
          with sync_playwright() as pw:
              try:
                  pw.chromium.launch(headless=True, chromium_sandbox=True).close()
                  print("Sandbox launch succeeds before AppArmor profile setup")
              except Error as error:
                  print("Sandbox launch before profile setup:", error)
          PY
          uv run python scripts/chromium_apparmor.py --output /tmp/account-access-chromium.apparmor
          sudo apparmor_parser -r /tmp/account-access-chromium.apparmor
      - name: Verify sandboxed Chromium
        run: |
          uv run python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              pw.chromium.launch(headless=True, chromium_sandbox=True).close()
          PY
      - run: uv run ruff check account_access tests scripts macos/notarize.py
      - run: uv run pytest -q
      - run: uv run pip-audit --local
      - run: uv build
