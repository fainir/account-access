name: Account Access checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-owner-gateway:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Type-check production owner channel for both Mac architectures
        run: |
          for AC_GATEWAY_ARCH in arm64 x86_64; do
            xcrun swiftc -parse-as-library -warnings-as-errors -typecheck \
              -target "$AC_GATEWAY_ARCH-apple-macos13" -framework Foundation -framework Security \
              macos/OwnerGateway.swift
          done
      - name: Exercise native XPC peers and owner broker routes with fictional data
        run: uv run python scripts/mac_owner_gateway_smoke.py --report /tmp/account-access-owner-gateway.json
      - name: Check complete-image owner pin rotation with fictional policies
        run: |
          xcrun swiftc -O -parse-as-library -warnings-as-errors -framework Foundation \
            macos/ComponentUpdatePolicies.swift macos/FullImageUpdatePolicies.swift \
            macos/Tests/FullImageUpdatePolicyChecks.swift -o /tmp/account-access-full-image-policy-checks
          /tmp/account-access-full-image-policy-checks > /tmp/account-access-full-image-policy.json
      - name: Check complete-image subtree storage in fresh ordinary temp directories
        run: |
          xcrun swiftc -O -parse-as-library -warnings-as-errors -framework Foundation -framework CryptoKit \
            macos/InstallerPayload.swift macos/FullImageTreeAttachment.swift macos/FullImageTreeStorage.swift \
            macos/Tests/FullImageTreeStorageChecks.swift -o /tmp/account-access-full-image-tree-checks
          /tmp/account-access-full-image-tree-checks > /tmp/account-access-full-image-tree.json
      - name: Check Python and native complete-image CA plan agreement with fictional data
        run: |
          uv run python scripts/mac_full_image_plan_fixture.py --output /tmp/account-access-full-image-plan-inputs > /tmp/account-access-full-image-plan-inputs.json
          xcrun swiftc -O -parse-as-library -warnings-as-errors -framework Foundation -framework CryptoKit \
            macos/InstallerPayload.swift macos/ComponentUpdatePolicies.swift \
            macos/FullImageTreeAttachment.swift macos/FullImageTreeStorage.swift macos/FullImagePlan.swift \
            macos/Tests/FullImagePlanChecks.swift -o /tmp/account-access-full-image-plan-checks
          /tmp/account-access-full-image-plan-checks /tmp/account-access-full-image-plan-inputs > /tmp/account-access-full-image-plan.log
          tail -n 1 /tmp/account-access-full-image-plan.log > /tmp/account-access-full-image-plan.json
      - name: Check mixed complete-image transitions and durable recovery with fictional data
        run: |
          sources=(macos/InstallerPayload.swift macos/ComponentUpdate.swift macos/ComponentUpdatePolicies.swift
            macos/ComponentUpdateIdentity.swift macos/InstallationRootBinding.swift macos/InstallationRootRevalidation.swift
            macos/FullImageTreeAttachment.swift macos/FullImageTreeStorage.swift macos/FullImagePlan.swift
            macos/FullImageTransitionStorage.swift macos/FullImageGlobalJournal.swift)
          xcrun swiftc -O -parse-as-library -warnings-as-errors -framework Foundation -framework CryptoKit -framework Security \
            "${sources[@]}" macos/Tests/FullImageTransitionStorageChecks.swift -o /tmp/account-access-full-image-mixed-checks
          /tmp/account-access-full-image-mixed-checks > /tmp/account-access-full-image-mixed.json
          xcrun swiftc -O -parse-as-library -warnings-as-errors -framework Foundation -framework CryptoKit -framework Security \
            "${sources[@]}" macos/Tests/FullImageGlobalJournalChecks.swift -o /tmp/account-access-full-image-journal-checks
          /tmp/account-access-full-image-journal-checks > /tmp/account-access-full-image-journal.json
      - name: Check fixed installed-adapter sources and ordinary temporary fixtures
        run: uv run python scripts/mac_full_image_installed_probe.py --output /private/tmp/account-access-full-image-installed-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-owner-gateway
          path: |
            /tmp/account-access-owner-gateway.json
            /tmp/account-access-full-image-policy.json
            /tmp/account-access-full-image-tree.json
            /tmp/account-access-full-image-plan-inputs.json
            /tmp/account-access-full-image-plan.json
            /tmp/account-access-full-image-plan.log
            /tmp/account-access-full-image-mixed.json
            /tmp/account-access-full-image-journal.json
            /private/tmp/account-access-full-image-installed-probe
          if-no-files-found: ignore
  native-owner-ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check native owner screen and masked sync fields
        run: |
          xcrun swiftc -O -parse-as-library -D ACCOUNT_ACCESS_UI_CHECKS \
            -framework AppKit -framework CryptoKit -framework CoreBluetooth -framework ServiceManagement -lsqlite3 -lbsm \
            macos/AccountAccess.swift macos/MailboxOAuthLoopback.swift macos/OwnerGateway.swift macos/DesktopOwnerConnection.swift macos/BrowserNativeHost.swift macos/ManagedAgentSetup.swift macos/WorkerBootstrap.swift macos/WorkerListenerBindings.swift macos/BackgroundRecovery.swift macos/MessageText.swift macos/MessagesReader.swift macos/SystemMessagesReader.swift macos/Tests/OwnerScreenChecks.swift \
            -o /tmp/account-access-owner-checks
          /tmp/account-access-owner-checks
      - name: Check signed-desktop Gmail callback parsing and listener lifetime
        run: |
          xcrun swiftc -O -parse-as-library -framework Foundation -framework Network -framework Security \
            macos/MailboxOAuthLoopback.swift macos/OwnerGateway.swift macos/Tests/MailboxOAuthLoopbackChecks.swift \
            -o /tmp/account-access-mailbox-oauth-checks
          /tmp/account-access-mailbox-oauth-checks > /tmp/account-access-mailbox-oauth.json
      - name: Check protected desktop registration and reconnect behavior
        run: |
          xcrun swiftc -O -parse-as-library -warnings-as-errors -D ACCOUNT_ACCESS_GATEWAY_CHECKS \
            -framework Foundation -framework Security macos/OwnerGateway.swift macos/DesktopOwnerConnection.swift \
            macos/Tests/DesktopOwnerConnectionChecks.swift -o /tmp/account-access-desktop-owner-checks
          /tmp/account-access-desktop-owner-checks > /tmp/account-access-desktop-owner.json
      - name: Check the protected Chrome bridge without owner credentials
        run: |
          xcrun swiftc -O -parse-as-library -warnings-as-errors -D ACCOUNT_ACCESS_GATEWAY_CHECKS \
            -framework Foundation -framework Security macos/OwnerGateway.swift macos/DesktopOwnerConnection.swift \
            macos/BrowserNativeHost.swift macos/Tests/BrowserNativeHostChecks.swift -o /tmp/account-access-browser-native-checks
          /tmp/account-access-browser-native-checks > /tmp/account-access-browser-native.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-desktop-owner
          path: |
            /tmp/account-access-desktop-owner.json
            /tmp/account-access-browser-native.json
            /tmp/account-access-mailbox-oauth.json
          if-no-files-found: ignore
      - name: Check the narrow native Messages reader
        run: |
          xcrun swiftc -O -parse-as-library \
            -framework AppKit -framework CryptoKit -lsqlite3 \
            macos/MessageText.swift macos/MessagesReader.swift macos/Tests/MessagesReaderChecks.swift \
            -o /tmp/account-access-messages-checks
          /tmp/account-access-messages-checks
      - name: Check background helper paths and approval lifecycle
        run: |
          xcrun swiftc -O -parse-as-library \
            -framework Foundation -framework CryptoKit -framework ServiceManagement \
            macos/BackgroundRecovery.swift macos/Tests/BackgroundRecoveryChecks.swift \
            -o /tmp/account-access-background-checks
          /tmp/account-access-background-checks
      - name: Check inert background helper entrypoint
        run: |
          xcrun swiftc -O -parse-as-library \
            -framework Foundation -framework CryptoKit -framework ServiceManagement \
            macos/BackgroundRecovery.swift macos/BackgroundHost.swift \
            -o /tmp/account-access-background-entry-checks
          /tmp/account-access-background-entry-checks
      - name: Check optimized app startup and reopening
        run: |
          xcrun swiftc -O -parse-as-library -D ACCOUNT_ACCESS_LAUNCH_CHECKS \
            -framework AppKit -framework CryptoKit -framework ServiceManagement -lsqlite3 -lbsm \
            macos/AccountAccess.swift macos/MailboxOAuthLoopback.swift macos/OwnerGateway.swift macos/DesktopOwnerConnection.swift macos/BrowserNativeHost.swift macos/ManagedAgentSetup.swift macos/WorkerBootstrap.swift macos/WorkerListenerBindings.swift macos/BackgroundRecovery.swift macos/MessageText.swift macos/MessagesReader.swift macos/SystemMessagesReader.swift \
            -o /tmp/account-access-launch-checks
          AC_QA_ROOT=$(mktemp -d)
          ACCOUNT_ACCESS_DATA_DIR="$AC_QA_ROOT/data" ACCOUNT_ACCESS_INSTALL_DIR="$AC_QA_ROOT/runtime" \
            /tmp/account-access-launch-checks
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - name: Audit dependencies before browser setup and long-running tests
        run: uv run pip-audit --local
      - name: Check that the installer uses the tested dependency hashes
        run: |
          uv export --locked --no-dev --no-emit-project --no-annotate --no-header --format requirements.txt --output-file /tmp/account-access-runtime.txt > /dev/null
          cmp account_access/runtime-requirements.txt /tmp/account-access-runtime.txt
      - run: uv run playwright install --with-deps chromium
      - name: Allow sandbox namespaces for the installed browser binaries
        run: |
          uv run python - <<'PY'
          from playwright.sync_api import Error, sync_playwright
          with sync_playwright() as pw:
              try:
                  pw.chromium.launch(headless=True, chromium_sandbox=True).close()
                  print("Sandbox launch succeeds before AppArmor profile setup")
              except Error as error:
                  print("Sandbox launch before profile setup:", error)
          PY
          uv run python scripts/chromium_apparmor.py --output /tmp/account-access-chromium.apparmor
          sudo apparmor_parser -r /tmp/account-access-chromium.apparmor
      - name: Verify sandboxed Chromium
        run: |
          uv run python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              pw.chromium.launch(headless=True, chromium_sandbox=True).close()
          PY
      - run: uv run ruff check account_access tests scripts macos/notarize.py macos/system_package.py macos/payload_audit.py macos/runtime_prepare.py macos/runtime_image.py macos/runtime_ca.py macos/full_image_update.py macos/bitwarden_runtime.py macos/bitwarden_sources.py macos/bitwarden_notices.py
      - run: uv run pytest -q
      - run: uv build
