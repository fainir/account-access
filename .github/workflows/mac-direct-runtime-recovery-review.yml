name: Direct runtime root recovery Installer acceptance
on:
  push:
    branches: [codex/production-security-authlib-20261028]
    paths: [artifacts/direct-runtime-root-recovery-inputs.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-inputs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download pinned public program files and signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/direct-inputs"
          AC_RELEASE=$(python3 -c 'import json; print(json.load(open("artifacts/direct-runtime-root-recovery-inputs.json"))["release_tag"])')
          gh release download "$AC_RELEASE" --repo fainir/account-access --pattern baseline.tar.gz --pattern candidate.pkg --pattern fresh.pkg --dir "$RUNNER_TEMP/direct-inputs"
          python3 - "$RUNNER_TEMP/direct-inputs" <<'PY'
          import hashlib, json, pathlib, sys
          contract = json.loads(pathlib.Path('artifacts/direct-runtime-root-recovery-inputs.json').read_bytes())
          for name, pin in contract['assets'].items():
              path = pathlib.Path(sys.argv[1]) / name
              with path.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == pin['sha256']
              assert path.stat().st_size == pin['bytes']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-public-inputs
          path: ${{ runner.temp }}/direct-inputs
          compression-level: 0
          retention-days: 3
  actual-installer:
    needs: public-inputs
    runs-on: macos-15
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        mode: [upgrade, fresh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --locked
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: direct-public-inputs
          path: ${{ runner.temp }}/direct-inputs
      - name: Run exact Installer update and reapply on synthetic private state
        run: |
          AC_PYTHON=$(uv run python -c 'import sys; print(sys.executable)')
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=C LC_ALL=C \
            GITHUB_ACTIONS=true CI=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=macOS RUNNER_ARCH=ARM64 \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            "$AC_PYTHON" -I -B "$GITHUB_WORKSPACE/scripts/mac_direct_runtime_installer_probe.py" \
              --inputs "$RUNNER_TEMP/direct-inputs" --output "$RUNNER_TEMP/direct-installer-evidence" --mode '${{ matrix.mode }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-installer-evidence-${{ matrix.mode }}
          path: ${{ runner.temp }}/direct-installer-evidence/*.log
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-installer-result-${{ matrix.mode }}
          path: ${{ runner.temp }}/direct-installer-evidence/report.json
          retention-days: 7
