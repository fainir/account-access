name: Genuine publisher transport review
on:
  push:
    branches: [codex/production-auth]
    paths:
      - .github/workflows/mac-publisher-transport.yml
      - scripts/mac_publisher_processes.py
      - tests/test_mac_publisher_processes.py
      - scripts/mac_publisher_transport_probe.py
      - scripts/check_mac_publisher_transport_report.py
      - tests/test_mac_publisher_transport.py
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  AC_REVIEW_SOURCE: 57e77027149af1e7dd1eaa694865a33f8313dd5e
  AC_REVIEW_SHA256: ba332fe7bf51f229faea2900d82408905ce13990c2659fcf8bb605c27698c370
  AC_REVIEW_ASSET_ID: '653055506'
  AC_REVIEW_RELEASE_ID: '416350163'
  AC_REVIEW_ASSET: account-access-publisher-transport-57e7702.tar.gz
  AC_REVIEW_TAG: qa-57e7702-publisher-transport
jobs:
  download-public-review:
    if: github.repository == 'fainir/account-access' && github.ref == 'refs/heads/codex/production-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # GitHub restricts draft visibility to push-capable tokens. This ordinary
    # download job only performs fixed GETs; its token never enters the Mac VM.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and hash-check the fixed public-code draft asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B scripts/mac_publisher_transport_probe.py download \
            --tag "$AC_REVIEW_TAG" --release-id "$AC_REVIEW_RELEASE_ID" --asset "$AC_REVIEW_ASSET" \
            --asset-id "$AC_REVIEW_ASSET_ID" --sha256 "$AC_REVIEW_SHA256" \
            --source "$AC_REVIEW_SOURCE" --output "$RUNNER_TEMP/$AC_REVIEW_ASSET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publisher-transport-public-input
          path: ${{ runner.temp }}/${{ env.AC_REVIEW_ASSET }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  publisher-transport:
    needs: download-public-review
    if: github.repository == 'fainir/account-access' && github.ref == 'refs/heads/codex/production-auth'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check the archive and report contracts without installing anything
        run: |
          uv sync --locked
          uv run pytest -q tests/test_mac_publisher_transport.py tests/test_mac_publisher_processes.py
          test "$(uname -m)" = arm64
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = fainir/account-access
          test ! -e '/Applications/Account Access.app'
          test ! -e '/Library/Application Support/Account Access'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publisher-transport-public-input
          path: ${{ runner.temp }}/account-access-review-input
      - name: Exercise genuine production transport in this fresh disposable VM
        run: |
          mkdir -m 700 "$RUNNER_TEMP/account-access-publisher-report"
          sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=en_US.UTF-8 \
            GITHUB_ACTIONS=true CI=true RUNNER_ENVIRONMENT=github-hosted \
            RUNNER_OS=macOS RUNNER_ARCH=ARM64 \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" \
            "$GITHUB_WORKSPACE/.venv/bin/python" -I -B \
            "$GITHUB_WORKSPACE/scripts/mac_publisher_transport_probe.py" run \
            --archive "$RUNNER_TEMP/account-access-review-input/$AC_REVIEW_ASSET" \
            --sha256 "$AC_REVIEW_SHA256" --source "$AC_REVIEW_SOURCE" \
            --report "$RUNNER_TEMP/account-access-publisher-report/report.json"
      - name: Require the complete transport-only report
        run: |
          uv run python scripts/check_mac_publisher_transport_report.py \
            "$RUNNER_TEMP/account-access-publisher-report/report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genuine-publisher-transport-review
          path: ${{ runner.temp }}/account-access-publisher-report
          if-no-files-found: warn
